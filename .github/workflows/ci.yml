# Runs the tests on Linux, macOS and Windows, with both the oldest
# supported Go (1.24, from go.mod) and the newest, plus formatting and
# staticcheck. See docs/implementation-plan.md §8. The wasm job runs the
# web version's packages as WebAssembly (docs/web-plan.md §8).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      # The race detector needs cgo, which the Windows runners don't set up
      # by default, so Windows runs the tests without it.
      - name: Test (with race detector)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Build
        run: go build ./cmd/codebreaker

  wasm:
    name: test (WebAssembly, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Test as WebAssembly under Node.js
        run: make test-wasm

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
