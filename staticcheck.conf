# staticcheck configuration.
# "inherit" keeps the default checks. The ST10xx checks are added because they
# enforce the doc-comment rules in docs/implementation-plan.md §1:
#   ST1000  every package has a package comment
#   ST1020  an exported function's comment starts with its name
#   ST1021  an exported type's comment starts with its name
#   ST1022  an exported variable/constant's comment starts with its name
checks = ["inherit", "ST1000", "ST1020", "ST1021", "ST1022"]
